name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  continuous-integration:
    name: Continuous Integration
    runs-on: self-hosted
    env:
      ENVIRONMENT: test
      GOOGLE_API_KEY: ci-placeholder
      TAVILY_API_KEY: ci-placeholder
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python --version
        working-directory: ${{ github.workspace }}
      - run: python -m pip install --upgrade pip
        working-directory: ${{ github.workspace }}
      - run: python -m pip install -r requirements.txt pytest
        working-directory: ${{ github.workspace }}
      - name: Verify project modules
        working-directory: ${{ github.workspace }}
        run: python -c "import app, tools; print(app.__file__); print(tools.__file__)"
      - name: Run backend tests
        working-directory: ${{ github.workspace }}
        run: python -m pytest -vv --tb=short

  frontend-ci:
    name: Flutter Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - run: flutter analyze
        working-directory: frontend
      - run: flutter test
        working-directory: frontend
      - run: flutter build web --release
        working-directory: frontend

  continuous-deployment:
    name: Continuous Deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [continuous-integration, frontend-ci]
    runs-on: self-hosted
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.aws_access_key }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.aws_secret_key || secrets.aws_secret_access_key }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || secrets.AWS_REGION || secrets.default_region }}
      AWS_ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY || secrets.ECR_REPOSITORY || secrets.AWS_REPO || secrets.repo }}
      ENVIRONMENT: production
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || secrets.postgres_user || 'ishani' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || secrets.postgres_password }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || secrets.postgres_db || 'ishani_gpt' }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.google_api_key }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || secrets.tavily_api_key || '' }}
      FRONTEND_ORIGINS: ${{ secrets.FRONTEND_ORIGINS || secrets.frontend_origins }}
    steps:
      - name: Free runner disk space before deployment
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          docker container prune --force || true
          docker image prune --all --force || true
          docker builder prune --all --force || true
          docker volume prune --force || true
          docker system prune --all --force --volumes || true
          sudo apt-get clean || true
          sudo journalctl --vacuum-size=20M >/dev/null 2>&1 || true
          rm -rf /tmp/awscli-install /tmp/awscliv2.zip "$HOME"/.cache/pip
          df -h /
          AVAILABLE_GB="$(df -BG / | awk 'NR == 2 { gsub("G", "", $4); print $4 }')"
          if [ "$AVAILABLE_GB" -lt 4 ]; then
            echo "::error::Only ${AVAILABLE_GB}GB is available on /. Expand the EC2 root volume before deployment."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          docker container prune --force || true
          docker image prune --all --force || true
          docker builder prune --all --force || true
          docker volume prune --force || true
          docker system prune --all --force --volumes || true
          sudo rm -rf /tmp/awscli-install /tmp/awscliv2.zip
          sudo apt-get clean || true
          df -h /
      - name: Install AWS CLI
        shell: bash
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y curl unzip
            rm -rf /tmp/awscli-install /tmp/awscliv2.zip
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp/awscli-install
            /tmp/awscli-install/aws/install --install-dir "$HOME/.local/aws-cli" --bin-dir "$HOME/.local/bin" --update
            rm -rf /tmp/awscli-install /tmp/awscliv2.zip
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build and publish API image to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::AWS_ACCESS_KEY_ID or aws_access_key secret is missing"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::AWS_SECRET_ACCESS_KEY or aws_secret_key secret is missing"; exit 1; }
          test -n "$AWS_DEFAULT_REGION" || { echo "::error::AWS_DEFAULT_REGION or default_region secret is missing"; exit 1; }

          if [ -n "$AWS_ECR_REPOSITORY" ]; then
            REPOSITORY="${AWS_ECR_REPOSITORY##*/}"
          else
            REPOSITORY="${GITHUB_REPOSITORY##*/}"
          fi
          REPOSITORY="${REPOSITORY,,}"
          test -n "$REPOSITORY"

          aws sts get-caller-identity >/dev/null
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          IMAGE_URI="${REGISTRY}/${REPOSITORY}"

          if ! aws ecr describe-repositories --repository-names "$REPOSITORY" --region "$AWS_DEFAULT_REGION" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "$REPOSITORY" --region "$AWS_DEFAULT_REGION"
          fi

          aws ecr get-login-password --region "$AWS_DEFAULT_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

          echo "Building and pushing ${IMAGE_URI}:${GITHUB_SHA}"
          docker build \
            --tag "${IMAGE_URI}:${GITHUB_SHA}" \
            --tag "${IMAGE_URI}:latest" \
            .
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"

          aws ecr batch-get-image \
            --repository-name "$REPOSITORY" \
            --region "$AWS_DEFAULT_REGION" \
            --image-ids imageTag=latest >/dev/null
      - name: Deploy API with Docker Compose on the AWS runner
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          if [ -z "$POSTGRES_PASSWORD" ]; then
            mkdir -p "$HOME/.ishanigpt"
            PASSWORD_FILE="$HOME/.ishanigpt/postgres_password"
            if [ ! -s "$PASSWORD_FILE" ]; then
              openssl rand -base64 32 | tr -d '\n' > "$PASSWORD_FILE"
              chmod 600 "$PASSWORD_FILE"
            fi
            POSTGRES_PASSWORD="$(cat "$PASSWORD_FILE")"
            export POSTGRES_PASSWORD
            echo "::warning::POSTGRES_PASSWORD secret is not configured; using a password persisted on the runner"
          fi
          test -n "$GOOGLE_API_KEY" || { echo "::error::GOOGLE_API_KEY secret is missing"; exit 1; }
          test -n "$FRONTEND_ORIGINS" || { echo "::error::FRONTEND_ORIGINS secret is missing"; exit 1; }

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          if [ -n "$AWS_ECR_REPOSITORY" ]; then
            REPOSITORY="${AWS_ECR_REPOSITORY##*/}"
          else
            REPOSITORY="${GITHUB_REPOSITORY##*/}"
          fi
          REPOSITORY="${REPOSITORY,,}"
          export API_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${REPOSITORY}:latest"

          df -h /
          if ! docker compose pull api; then
            echo "::error::Docker image pull failed; showing disk usage and removing unused images"
            df -h /
            docker system prune --all --force
            docker compose pull api
          fi
          docker compose up -d --pull never --no-build postgres api
          docker compose ps
          docker compose logs --tail=100 api || true
          curl --fail --retry 20 --retry-delay 5 --retry-all-errors http://127.0.0.1:8000/health
