name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  continuous-integration:
    name: Continuous Integration
    runs-on: self-hosted
    env:
      ENVIRONMENT: test
      GOOGLE_API_KEY: ci-placeholder
      TAVILY_API_KEY: ci-placeholder
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python --version
        working-directory: ${{ github.workspace }}
      - run: python -m pip install --upgrade pip
        working-directory: ${{ github.workspace }}
      - run: python -m pip install -r requirements.txt pytest
        working-directory: ${{ github.workspace }}
      - name: Verify project modules
        working-directory: ${{ github.workspace }}
        run: python -c "import app, tools; print(app.__file__); print(tools.__file__)"
      - name: Run backend tests
        working-directory: ${{ github.workspace }}
        run: python -m pytest -vv --tb=short

  frontend-ci:
    name: Flutter Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - run: flutter analyze
        working-directory: frontend
      - run: flutter test
        working-directory: frontend
      - run: flutter build web --release
        working-directory: frontend

  continuous-deployment:
    name: Continuous Deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [continuous-integration, frontend-ci]
    runs-on: self-hosted
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.aws_access_key }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.aws_secret_key || secrets.aws_secret_access_key }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || secrets.AWS_REGION || secrets.default_region }}
      AWS_ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY || secrets.ECR_REPOSITORY || secrets.AWS_REPO || secrets.repo }}
      ENVIRONMENT: production
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'ishani' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'ishani_gpt' }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || '' }}
      FRONTEND_ORIGINS: ${{ secrets.FRONTEND_ORIGINS }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish API image to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail

          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_DEFAULT_REGION"
          test -n "$AWS_ECR_REPOSITORY"

          aws sts get-caller-identity >/dev/null
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REPOSITORY="${AWS_ECR_REPOSITORY##*/}"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          IMAGE_URI="${REGISTRY}/${REPOSITORY}"

          aws ecr get-login-password --region "$AWS_DEFAULT_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

          docker build -t "${IMAGE_URI}:${GITHUB_SHA}" -t "${IMAGE_URI}:latest" .
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"
      - name: Deploy API with Docker Compose on the AWS runner
        shell: bash
        run: |
          set -euo pipefail

          test -n "$POSTGRES_PASSWORD"
          test -n "$GOOGLE_API_KEY"
          test -n "$FRONTEND_ORIGINS"

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REPOSITORY="${AWS_ECR_REPOSITORY##*/}"
          export API_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${REPOSITORY}:latest"

          docker compose pull api
          docker compose up -d --no-build postgres api
