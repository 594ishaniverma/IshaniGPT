name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  continuous-integration:
    name: Continuous Integration
    runs-on: self-hosted
    env:
      ENVIRONMENT: test
      GOOGLE_API_KEY: ci-placeholder
      TAVILY_API_KEY: ci-placeholder
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python --version
        working-directory: ${{ github.workspace }}
      - run: python -m pip install --upgrade pip
        working-directory: ${{ github.workspace }}
      - run: python -m pip install -r requirements.txt pytest
        working-directory: ${{ github.workspace }}
      - name: Verify project modules
        working-directory: ${{ github.workspace }}
        run: python -c "import app, tools; print(app.__file__); print(tools.__file__)"
      - name: Run backend tests
        working-directory: ${{ github.workspace }}
        run: python -m pytest -vv --tb=short

  frontend-ci:
    name: Flutter Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - run: flutter analyze
        working-directory: frontend
      - run: flutter test
        working-directory: frontend
      - run: flutter build web --release
        working-directory: frontend

  continuous-deployment:
    name: Continuous Deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [continuous-integration, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
