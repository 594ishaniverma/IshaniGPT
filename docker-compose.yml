services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ishani_gpt}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ishani_gpt}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?GOOGLE_API_KEY is required}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?FRONTEND_ORIGINS is required}
      CHECKPOINT_SQLITE_PATH: /app/checkpoints/langgraph_checkpoints.sqlite
      CHROMA_PERSIST_DIRECTORY: /app/chroma_db
      UPLOAD_DIR: /app/uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - chatbot-checkpoints:/app/checkpoints
      - chatbot-chroma:/app/chroma_db
      - chatbot-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  chatbot-checkpoints:
  chatbot-chroma:
  chatbot-uploads:
