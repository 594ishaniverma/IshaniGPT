<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IshaniGPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23168B67'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='18' fill='white'>✦</text></svg>" />
</head>
<body>

<!-- ============================================================
     AUTH SCREEN
     ============================================================ -->
<div id="auth-screen" class="hidden">
  <div class="auth-card">

    <!-- Brand -->
    <div class="auth-brand">
      <div class="brand-mark">✦</div>
      <span class="brand-name">IshaniGPT</span>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
      <button class="auth-tab"        id="tab-signup" onclick="switchTab('signup')">Create Account</button>
    </div>

    <!-- Error -->
    <div id="auth-error" class="inline-error hidden"></div>

    <!-- Sign In Form -->
    <form id="signin-form" onsubmit="handleSignIn(event)">
      <div class="form-group">
        <label class="form-label" for="signin-email">Email</label>
        <input class="form-input" id="signin-email" type="email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label" for="signin-password">Password</label>
        <input class="form-input" id="signin-password" type="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" id="signin-btn" type="submit">
        <span id="signin-btn-text">Sign In</span>
      </button>
    </form>

    <!-- Sign Up Form -->
    <form id="signup-form" class="hidden" onsubmit="handleSignUp(event)">
      <div class="form-group">
        <label class="form-label" for="signup-name">Full Name</label>
        <input class="form-input" id="signup-name" type="text" placeholder="Ishani" required autocomplete="name" />
      </div>
      <div class="form-group">
        <label class="form-label" for="signup-email">Email</label>
        <input class="form-input" id="signup-email" type="email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label" for="signup-password">Password</label>
        <input class="form-input" id="signup-password" type="password" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password" />
      </div>
      <button class="btn btn-primary" id="signup-btn" type="submit">
        <span id="signup-btn-text">Create Account</span>
      </button>
    </form>

  </div>
</div>

<!-- ============================================================
     CHAT SCREEN
     ============================================================ -->
<div id="chat-screen" class="hidden">

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="brand-mark" style="width:30px;height:30px;font-size:15px;border-radius:9px;">✦</div>
        <span class="brand-name">IshaniGPT</span>
      </div>
    </div>

    <button class="btn-new-chat" onclick="newConversation()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New Chat
    </button>

    <div class="conv-list" id="conv-list">
      <div class="conv-empty" id="conv-empty">No conversations yet</div>
    </div>

    <div class="sidebar-footer">
      <div class="user-avatar" id="user-avatar">?</div>
      <div class="user-info">
        <div class="user-name"  id="user-name">—</div>
        <div class="user-email" id="user-email">—</div>
      </div>
      <button class="btn-signout" title="Sign out" onclick="handleSignOut()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

  </aside>

  <!-- Main -->
  <main class="chat-main">

    <!-- Header -->
    <header class="chat-header">
      <button class="btn-menu" id="btn-menu" onclick="openSidebar()" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="chat-title" id="chat-title">Select a conversation</span>
    </header>

    <!-- Messages -->
    <div class="messages-area" id="messages-area">
      <div class="messages-inner" id="messages-inner">

        <!-- Empty state -->
        <div class="empty-state" id="empty-state">
          <div class="empty-brand-mark">✦</div>
          <div class="empty-title">How can I help you today?</div>
          <div class="empty-sub">Start a new chat or pick a conversation from the sidebar.</div>
        </div>

      </div>
    </div>

    <!-- Input bar -->
    <div class="input-bar">
      <div class="input-bar-inner">

        <textarea
          id="msg-input"
          placeholder="Message IshaniGPT…"
          rows="1"
          oninput="autoResize(this)"
          onkeydown="handleInputKeydown(event)"
        ></textarea>

        <input type="file" id="file-input" accept=".pdf,.docx,.txt,.md,.py,.csv" onchange="handleFileUpload(event)" />

        <button class="btn-attach" title="Upload file" onclick="document.getElementById('file-input').click()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05L12.25 20.24a5 5 0 0 1-7.07-7.07L14.4 3.95a3 3 0 0 1 4.24 4.24L9.41 17.41a1 1 0 0 1-1.41-1.41l8.29-8.29"/>
          </svg>
        </button>

        <button class="btn-send" id="btn-send" title="Send message" onclick="sendMessage()" disabled>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>

      </div>
    </div>

  </main>

</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
