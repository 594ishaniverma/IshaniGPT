[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///data/chatbot_memory.db

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = INFO
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
[formatter_generic]
format = %(levelname)s %(message)s
